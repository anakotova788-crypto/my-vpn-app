name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch amneziawg-tools
        run: |
          rm -rf github/tunnel/tools/amneziawg-tools
          git clone --depth 1 https://github.com/amnezia-vpn/amneziawg-tools.git github/tunnel/tools/amneziawg-tools

      - name: Build debug APK
        working-directory: github
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NektoVPN-debug
          path: github/ui/build/outputs/apk/debug/*.apk
          if-no-files-found: error
